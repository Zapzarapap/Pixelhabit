<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pixel Habits</title>
  <meta name="description" content="Simpler Habit-Tracker mit Wochenansicht, Zählern und Statistiken – alle Daten bleiben lokal im Browser.">
  <meta name="theme-color" content="#f2ede3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17131f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 9 8' shape-rendering='crispEdges'%3E%3Cpath fill='%23e04b3a' d='M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand" id="brand"></div>
    <nav class="tabs" aria-label="Seiten">
      <button class="tab" data-page="tracker">Tracker</button>
      <button class="tab" data-page="counter">Zähler</button>
      <button class="tab" data-page="stats">Statistik</button>
    </nav>
    <button class="btn small" id="settingsBtn" aria-label="Daten &amp; Backup">Daten</button>
  </header>

  <main id="app"></main>

  <dialog id="modal"></dialog>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
